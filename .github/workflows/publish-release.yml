name: "Step 2: Publish Release"
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "The target branch"
        required: false
      release_url:
        description: "The URL of the draft GitHub release"
        required: false
      steps_to_skip:
        description: "Comma separated list of steps to skip"
        required: false

jobs:
  publish_release:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hic-k8tre-egress-jupyter
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

      - name: Install dependencies
        run: python -m pip install -U "jupyterlab>=4.0.0,<5"

      - name: Lint the extension
        run: |
          set -eux
          jlpm
          jlpm run lint:check
  
      - name: Test the extension
        run: |
          set -eux
          jlpm run test

      - name: Build the extension
        run: |
          set -eux
          python -m pip install .[test]
  
          pytest -vv -r ap --cov hic_egress_request
          jupyter server extension list
          jupyter server extension list 2>&1 | grep -ie "hic_egress_request.*OK"
  
          jupyter labextension list
          jupyter labextension list 2>&1 | grep -ie "hic-egress-request.*OK"
          python -m jupyterlab.browser_check

      - name: Package the extension
        run: |
          set -eux
  
          pip install build
          python -m build
          pip uninstall -y "hic_egress_request" jupyterlab
  
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
      
